<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atmosphere Bench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%234a7ab8%27/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; left: 10px; bottom: 10px; color: #dfe6ee; font: 12px/1.45 ui-monospace, Menlo, monospace; background: rgba(8, 12, 18, .62); padding: 8px 10px; border-radius: 8px; white-space: pre; pointer-events: none; }
    #presets { position: fixed; right: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 520px; justify-content: flex-end; }
    #presets button { font: 12px system-ui; color: #dfe6ee; background: rgba(20, 28, 40, .8); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    body.clean #hud, body.clean #presets { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="presets"></div>
  <script type="module" src="/src/dev/atmosphere.js"></script>
</body>
</html>
