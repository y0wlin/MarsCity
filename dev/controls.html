<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Controls Bench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%23b5532c%27/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #bench-hud { position: fixed; left: 12px; top: 12px; color: #dfe6ee; font: 12px/1.45 ui-monospace, Menlo, monospace;
      background: rgba(10, 14, 20, .62); padding: 8px 10px; border-radius: 8px; pointer-events: none; white-space: pre; z-index: 10; }
    #bench-help { position: fixed; right: 12px; bottom: 12px; max-width: 460px; max-height: 60vh; overflow: auto; color: #cfd6de;
      font: 12px/1.5 system-ui, sans-serif; background: rgba(10, 14, 20, .62); padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; z-index: 10; }
    body.clean #bench-hud, body.clean #bench-help { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="bench-hud"></div>
  <div id="bench-help"></div>
  <script type="module" src="/src/dev/controls.js"></script>
</body>
</html>
